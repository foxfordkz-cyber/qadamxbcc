<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saq Bol — питч (қазақша)</title>
<style>
:root { --green:#00A859; --green-d:#008F4C; --ink:#101828; --muted:#475467; --line:#D0D5DD; --pale:#F4F6F8; --amber:#B54708; --red:#B42318; --dark:#0B3B2A; --mint:#6EE7A8; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; background:#04140D; font-family:"Segoe UI", "Inter", Arial, "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; }
.viewport { position:fixed; inset:0; display:grid; place-items:center; perspective:2000px; }
.stage { position:relative; width:1600px; height:900px; transform-origin:center; flex:none; }
.slide { position:absolute; inset:0; padding:56px 72px 0; visibility:hidden; overflow:hidden; border-radius:4px; }
.slide.active, .slide.leave { visibility:visible; }
.slide.light { background:var(--pale); color:var(--ink); }
.slide.dark { background:radial-gradient(120% 90% at 85% 10%, #14573F 0%, var(--dark) 45%, #06251A 100%); color:#fff; }
.slide::after { content:"Saq Bol · оқу прототипі · нақты төлемдер орындалмайды"; position:absolute; left:72px; bottom:22px; font-size:14px; color:var(--muted); }
.slide.dark::after { color:#9CC9B4; }

/* ---------- slide transitions ---------- */
.slide.active.t-zoom  { animation:in-zoom .9s cubic-bezier(.2,.8,.2,1) both; }
.slide.active.t-slide { animation:in-slide .8s cubic-bezier(.2,.8,.2,1) both; }
.slide.active.t-slide.back { animation-name:in-slide-back; }
.slide.active.t-rise  { animation:in-rise .85s cubic-bezier(.2,.8,.2,1) both; }
.slide.active.t-flip  { animation:in-flip 1s cubic-bezier(.2,.8,.2,1) both; transform-origin:left center; }
.slide.leave { animation:out .7s cubic-bezier(.6,0,.4,1) both; z-index:0; }
.slide.leave.back { animation-name:out-back; }
.slide.active { z-index:1; }
@keyframes in-zoom { from { opacity:0; transform:scale(.82); filter:blur(14px); } to { opacity:1; transform:none; filter:none; } }
@keyframes in-slide { from { transform:translateX(100%); } to { transform:none; } }
@keyframes in-slide-back { from { transform:translateX(-100%); } to { transform:none; } }
@keyframes in-rise { from { opacity:0; transform:translateY(120px) scale(.96); } to { opacity:1; transform:none; } }
@keyframes in-flip { from { opacity:0; transform:rotateY(-75deg) translateX(-10%); } to { opacity:1; transform:none; } }
@keyframes out { to { opacity:0; transform:scale(.9) translateX(-6%); filter:blur(8px); } }
@keyframes out-back { to { opacity:0; transform:scale(.9) translateX(6%); filter:blur(8px); } }

/* ---------- staggered element entrances ---------- */
.a { opacity:0; }
.slide.active .a { animation:pop .8s cubic-bezier(.2,.9,.25,1.15) var(--d,0ms) both; }
.slide.leave .a { opacity:1; }
@keyframes pop { from { opacity:0; transform:translateY(34px) scale(.96); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }
.slide.active .phone.float { animation:pop .9s cubic-bezier(.2,.9,.25,1.15) var(--d) both, float 6s ease-in-out calc(var(--d) + 900ms) infinite; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }

/* ---------- typography ---------- */
h1 { font-size:58px; line-height:1.06; font-weight:800; letter-spacing:-.02em; }
h2 { font-size:46px; line-height:1.1; font-weight:800; letter-spacing:-.015em; }
h3 { font-size:22px; color:var(--mint); margin-bottom:20px; }
.lead { margin-top:12px; font-size:22px; color:var(--muted); max-width:1400px; }
.dark .lead { color:#CFE6DA; }
.kicker { font-size:20px; font-weight:700; color:var(--mint); letter-spacing:.02em; margin-bottom:22px; }
figcaption { margin-top:14px; text-align:center; font-size:18px; font-weight:700; color:var(--muted); }
figcaption.left { text-align:left; margin:0 0 10px; }
figcaption.amber { color:var(--amber); } figcaption.red { color:var(--red); }
figure { position:relative; display:flex; flex-direction:column; align-items:center; }

/* ---------- media ---------- */
.phone { height:560px; width:auto; filter:drop-shadow(0 26px 40px rgba(16,24,40,.28)); }
.shot { display:block; width:100%; height:auto; border-radius:14px; box-shadow:0 30px 60px -20px rgba(16,24,40,.35), 0 0 0 1px rgba(16,24,40,.06); }
.card { width:100%; border-radius:14px; box-shadow:0 18px 40px -16px rgba(16,24,40,.3); }
.row { display:flex; align-items:flex-start; gap:48px; margin-top:40px; }

/* steps */
.steps { list-style:none; display:grid; gap:26px; }
.steps li { display:flex; gap:18px; align-items:flex-start; font-size:21px; line-height:1.4; }
.steps li b { flex:none; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:18px; background:#E6F6EC; color:#067647; border:1.5px solid var(--green); margin-top:-4px; }
.steps.big { width:620px; gap:40px; margin-top:20px; } .steps.big li { font-size:24px; }
.steps.side { width:470px; margin-top:20px; gap:34px; }
.steps.wide { grid-template-columns:1fr; gap:14px; margin-top:28px; } .steps.wide li { font-size:19px; }
.steps.dark li b { background:#14573F; color:#fff; border-color:var(--mint); } .steps.dark li { color:#fff; }

/* cover */
.cover-text { position:absolute; left:72px; top:120px; width:660px; }
.cover-text .lead { font-size:24px; margin-top:24px; }
.chips { display:flex; gap:14px; margin-top:44px; }
.chip { padding:12px 22px; border-radius:14px; background:#14573F; border:1px solid #2F7A5C; font-size:18px; font-weight:700; }
.fan .phone { position:absolute; height:660px; }
.fan .p1 { left:820px; top:150px; height:600px; } .fan .p3 { left:1250px; top:150px; height:600px; } .fan .p2 { left:1010px; top:90px; height:700px; z-index:2; }
.fan .p1 { --tilt:-6deg; } .fan .p3 { --tilt:6deg; }
.slide.active .fan .p1, .slide.active .fan .p3 { rotate:var(--tilt); }

/* problem */
.phones { display:flex; align-items:center; gap:26px; margin-left:auto; }
.arrow { font-size:54px; color:var(--green); font-weight:800; }
.slide.active .arrow { animation:pop .8s var(--d) both, nudge 1.6s ease-in-out calc(var(--d) + 800ms) infinite; }
@keyframes nudge { 50% { transform:translateX(10px); } }
.glow-amber { filter:drop-shadow(0 26px 40px rgba(16,24,40,.28)) drop-shadow(0 0 0 rgba(247,144,9,0)); }
.slide.active .glow-amber { animation:pop .9s var(--d) both, amber 2.4s ease-in-out calc(var(--d) + 900ms) infinite; }
@keyframes amber { 50% { filter:drop-shadow(0 26px 40px rgba(16,24,40,.28)) drop-shadow(0 0 26px rgba(247,144,9,.75)); } }

/* decisions */
.trio { display:flex; justify-content:space-around; margin-top:34px; }
.trio .phone { height:540px; margin-top:22px; }
.trio.small { gap:22px; justify-content:flex-start; margin-top:0; } .trio.small .phone { height:540px; margin-top:0; }
.score { padding:12px 26px; border-radius:14px; font-size:22px; font-weight:800; }
.score.ok { background:#E6F6EC; color:#067647; } .score.warn { background:#FFF3DC; color:var(--amber); } .score.bad { background:#FEECEB; color:var(--red); }

/* trusted */
.trusted { gap:44px; } .trusted .phone { height:600px; }
.cards { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:20px 28px; align-content:start; }
.cards .steps { grid-column:1 / -1; }
.slide.active .shake { animation:pop .8s var(--d) both, shake .6s ease-in-out calc(var(--d) + 800ms) 2, redglow 2.4s ease-in-out calc(var(--d) + 2000ms) infinite; }
@keyframes shake { 20% { transform:translateX(-8px) rotate(-.6deg); } 40% { transform:translateX(8px) rotate(.6deg); } 60% { transform:translateX(-5px); } 80% { transform:translateX(5px); } }
@keyframes redglow { 50% { box-shadow:0 0 0 6px rgba(217,45,32,.18), 0 18px 40px -16px rgba(217,45,32,.5); } }

/* SOC */
.shot-wrap { position:relative; width:980px; flex:none; border-radius:14px; overflow:hidden; box-shadow:0 30px 60px -20px rgba(16,24,40,.35); }
.shot-wrap .shot { box-shadow:none; border-radius:0; }
.slide.active .kenburns { animation:pop .8s var(--d) both, kb 16s ease-in-out calc(var(--d) + 800ms) infinite alternate; transform-origin:25% 70%; }
@keyframes kb { to { transform:scale(1.12); } }
.pulse-dot { position:absolute; width:18px; height:18px; border-radius:50%; background:var(--green); opacity:0; }
.slide.active .pulse-dot { animation:ping 1.8s ease-out 1.6s infinite; }
@keyframes ping { 0% { opacity:.9; box-shadow:0 0 0 0 rgba(0,168,89,.7); } 100% { opacity:0; box-shadow:0 0 0 36px rgba(0,168,89,0); } }

/* graph */
.slide.active .draw { animation:fade .01s var(--d) both, reveal 1.6s cubic-bezier(.4,0,.2,1) var(--d) both; }
@keyframes fade { to { opacity:1; } }
@keyframes reveal { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
.side-col { width:420px; display:grid; gap:18px; }
.note { font-size:17px; color:var(--muted); line-height:1.45; }

/* live demo */
.demo { align-items:center; gap:30px; margin-top:34px; }
.demo .grow { width:930px; flex:none; }
.qr-ring { position:absolute; left:80%; top:19%; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:24px; border:4px solid var(--green); }
.slide.active .qr-ring { animation:pop .6s var(--d) both, qr 1.8s ease-out calc(var(--d) + 600ms) infinite; }
@keyframes qr { 0% { box-shadow:0 0 0 0 rgba(0,168,89,.55); } 100% { box-shadow:0 0 0 34px rgba(0,168,89,0); } }
.beam { position:relative; width:140px; height:16px; }
.beam i { position:absolute; top:3px; width:12px; height:12px; border-radius:50%; background:var(--green); opacity:0; }
.slide.active .beam i { animation:travel 1.6s linear infinite; } .beam i:nth-child(2) { animation-delay:.53s !important; } .beam i:nth-child(3) { animation-delay:1.06s !important; }
@keyframes travel { 0% { right:0; opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { right:100%; opacity:0; } }
.demo .phone { height:560px; }

/* proof */
.stats { display:grid; grid-template-columns:1fr 1fr; gap:22px; width:820px; flex:none; }
.stat { background:#fff; border:1px solid var(--line); border-radius:20px; padding:30px 32px; min-height:250px; box-shadow:0 10px 30px -18px rgba(16,24,40,.25); }
.stat strong { display:block; font-size:64px; font-weight:800; color:#067647; letter-spacing:-.02em; }
.stat > span { display:block; font-size:19px; line-height:1.45; margin-top:10px; }
.case { width:auto; height:580px; }

/* close */
.close { gap:56px; }
.close > div { width:470px; }
.timeline { list-style:none; position:relative; padding-left:30px; display:grid; gap:30px; }
.timeline::before { content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--mint), transparent); }
.timeline li { position:relative; font-size:19px; line-height:1.45; color:#CFE6DA; }
.timeline li::before { content:""; position:absolute; left:-30px; top:7px; width:14px; height:14px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 5px rgba(110,231,168,.2); }
.timeline b { display:block; color:#fff; font-size:21px; }
.close .phone { height:600px; margin-left:auto; margin-top:-30px; }

/* ---------- chrome ---------- */
.progress { position:fixed; left:0; bottom:0; height:4px; background:var(--green); width:0; transition:width .6s cubic-bezier(.2,.8,.2,1); z-index:10; box-shadow:0 0 12px var(--green); }
.counter { position:fixed; right:18px; bottom:14px; font:600 14px/1 system-ui, sans-serif; color:#9CC9B4; z-index:10; background:rgba(4,20,13,.6); padding:8px 12px; border-radius:10px; }
.hint { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); font:500 13px/1 system-ui, sans-serif; color:#9CC9B4; background:rgba(4,20,13,.7); padding:9px 14px; border-radius:10px; z-index:10; transition:opacity .6s; }
.hint.hide { opacity:0; pointer-events:none; }
.notes { position:fixed; left:0; right:0; bottom:0; max-height:34vh; overflow:auto; background:rgba(4,20,13,.94); color:#E4F3EB; font:17px/1.55 system-ui, sans-serif; padding:18px 28px 28px; transform:translateY(100%); transition:transform .4s; z-index:11; white-space:pre-line; }
.notes.open { transform:none; }
.notes b { color:var(--mint); display:block; margin-bottom:6px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }

@media (prefers-reduced-motion: reduce) {
  .slide, .slide *, .slide.active .a { animation:none !important; transition:none !important; }
  .a { opacity:1; }
}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
{{SLIDES}}
</div></div>
<div class="progress" id="progress"></div>
<div class="counter" id="counter"></div>
<div class="hint" id="hint">← → немесе бос орын · F — толық экран · N — баяндамашы жазбалары</div>
<div class="notes" id="notes"><b>Баяндамашы жазбалары</b><span id="notes-text"></span></div>
<script>
const IMGS = {{IMGS}};
document.querySelectorAll("img[data-img]").forEach(el => { el.src = IMGS[el.dataset.img]; el.decoding = "async"; });
const stage = document.getElementById("stage");
const slides = [...document.querySelectorAll(".slide")];
let current = -1, busy = false;
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();
function countUp(slide) {
  slide.querySelectorAll(".count").forEach(el => {
    const to = Number(el.dataset.to), start = performance.now(), delay = 700, dur = 1400;
    el.textContent = "0";
    const tick = now => { const p = Math.min(1, Math.max(0, (now - start - delay) / dur)); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function show(index, back = false) {
  index = Math.max(0, Math.min(slides.length - 1, index));
  if (index === current || busy) return;
  const prev = slides[current], next = slides[index];
  busy = true; setTimeout(() => busy = false, 450);
  if (prev) {
    prev.classList.remove("active", "t-zoom", "t-slide", "t-rise", "t-flip");
    prev.classList.toggle("back", back); prev.classList.add("leave");
    setTimeout(() => prev.classList.remove("leave", "back"), 750);
  }
  next.classList.remove("leave", "back");
  void next.offsetWidth; // restart the entrance animations on every visit
  next.classList.toggle("back", back);
  next.classList.add("active", "t-" + next.dataset.t);
  current = index;
  countUp(next);
  document.getElementById("progress").style.width = `${(index + 1) / slides.length * 100}%`;
  document.getElementById("counter").textContent = `${index + 1} / ${slides.length}`;
  document.getElementById("notes-text").textContent = next.dataset.notes;
  history.replaceState(null, "", `#${index + 1}`);
}
const go = d => show(current + d, d < 0);
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "Home") show(0, true);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  else if (e.key.toLowerCase() === "n") document.getElementById("notes").classList.toggle("open");
  document.getElementById("hint").classList.add("hide");
});
addEventListener("click", e => { if (e.target.closest(".notes")) return; go(e.clientX > innerWidth / 3 ? 1 : -1); document.getElementById("hint").classList.add("hide"); });
let sx = null;
addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); sx = null; });
setTimeout(() => document.getElementById("hint").classList.add("hide"), 6000);
show(Math.min(slides.length, Math.max(1, parseInt(location.hash.slice(1)) || 1)) - 1);
</script>
</body>
</html>
