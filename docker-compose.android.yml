name: qadam-android
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bcc
      POSTGRES_PASSWORD: bcc
      POSTGRES_DB: bcc_android_demo
    volumes: ["android_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcc -d bcc_android_demo"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["android_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  gateway:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade heads && python -m scripts.bootstrap_demo && exec python -m scripts.mobile_demo --lan"]
    environment:
      BCC_ENVIRONMENT: demo
      BCC_BOOTSTRAP_DEMO: "true"
      BCC_DATABASE_URL: postgresql+asyncpg://bcc:bcc@postgres:5432/bcc_android_demo
      BCC_REDIS_URL: redis://redis:6379/0
      BCC_MOBILE_ACCESS_DIR: /mobile-access
      BCC_MOBILE_AUTH_MODE: ${QADAM_MOBILE_AUTH_MODE:-password}
    volumes:
      - "./.local-checks/mobile-access:/mobile-access"
      - "./backend/.qadam-web:/app/.qadam-web:ro"
    ports: ["${QADAM_MOBILE_BIND:-127.0.0.1}:${QADAM_MOBILE_PORT:-18001}:18001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18001/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
volumes:
  android_pgdata:
  android_redisdata:
