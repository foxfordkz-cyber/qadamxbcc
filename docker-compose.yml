name: bcc-shield

services:
  postgres:
    image: postgres:16-alpine
    # LOCAL/DEMO ONLY: Docker Desktop volumes make each WAL fsync cost ~60 ms, which
    # dominates request latency on a laptop. With synchronous_commit=off a crash can lose
    # the last few hundred ms of commits (no corruption). Do not carry this to production.
    command: ["postgres", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: bcc
      POSTGRES_PASSWORD: bcc
      POSTGRES_DB: bcc_shield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcc -d bcc_shield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      BCC_DATABASE_URL: postgresql+asyncpg://bcc:bcc@postgres:5432/bcc_shield
      BCC_REDIS_URL: redis://redis:6379/0
      BCC_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      # live = proxy to the FastAPI backend; presets target accounts from scripts/seed_bcc.py
      BCC_API_MODE: live
      BCC_API_URL: http://backend:8000
      BCC_NORMAL_SENDER_ID: 00000000-0000-4000-8000-000000000001
      BCC_NORMAL_RECIPIENT_PHONE: "+77010000002"
      BCC_SCAM_SENDER_ID: 00000000-0000-4000-8000-000000000001
      BCC_SCAM_RECIPIENT_PHONE: "+77010000003"
      BCC_HUB_SENDER_ID: 00000000-0000-4000-8000-000000000001
      BCC_HUB_RECIPIENT_PHONE: "+77010000004"
      # simulator test cards only
      BCC_CARD_ACCOUNT_MAP: '{"4400000000000002":"00000000-0000-4000-8000-000000000002","4400000000000003":"00000000-0000-4000-8000-000000000003","4400000000000004":"00000000-0000-4000-8000-000000000004"}'
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
