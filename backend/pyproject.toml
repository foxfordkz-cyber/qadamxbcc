[project]
name = "bcc-shield-backend"
version = "0.1.0"
description = "BCC Shield — real-time antifraud & drop-network detection for Bank CenterCredit transfers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "networkx>=3.3",
    "tzdata>=2024.1",
    "aiogram>=3.31,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis>=2.24",
    "aiosqlite>=0.20",
    "types-networkx>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "C4", "PT"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF001",  # Kazakh/Cyrillic strings are intentional
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["fakeredis.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --basetemp=.pytest_tmp"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
