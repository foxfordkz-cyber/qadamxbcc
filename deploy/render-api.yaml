# Render Blueprint Path for the Cloudflare frontend and Render API deployment.
services:
  - type: web
    name: saq-bol-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh scripts/start-render-api.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saq-bol-api-db
          property: connectionString
      - key: BCC_REDIS_URL
        fromService:
          type: keyvalue
          name: saq-bol-api-cache
          property: connectionString
      - key: BCC_ENVIRONMENT
        value: demo
      - key: BCC_BOOTSTRAP_DEMO
        value: "true"
      - key: BCC_API_KEY
        generateValue: true
      - key: BCC_SOC_API_KEY
        generateValue: true
      - key: BCC_CORS_ORIGINS
        value: "[]"

  - type: keyvalue
    name: saq-bol-api-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: saq-bol-api-db
    plan: free
    ipAllowList: []
    databaseName: bcc_shield
    user: bcc
