name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "BCC-Shield-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BCC-Shield-android-apk
          path: android-app/BCC-Shield-*.apk
          if-no-files-found: error
          retention-days: 30
