name: Install signed showcase
on:
  workflow_dispatch:
  pull_request:
    paths:
      - frontend/public/downloads/current.json
      - frontend/public/downloads/Saq-Bol-*.apk
      - .github/workflows/showcase-install.yml
      - android-app/scripts/verify-installed-showcase.sh
permissions:
  contents: read
jobs:
  clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Allow the runner to use hardware acceleration
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - name: Install and open the canonical showcase on clean Android 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-boot-timeout: 600
          script: bash android-app/scripts/verify-installed-showcase.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signed-showcase-login
          path: ${{ runner.temp }}/showcase-login.png
          if-no-files-found: error

