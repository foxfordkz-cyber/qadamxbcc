name: GitHub Pages demo

# Publishes the static Saq Bol demo (no server: the synthetic demo engine runs in the
# browser) to the gh-pages branch: https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build static demo
        working-directory: frontend
        env:
          # The export must ignore a developer's inherited live configuration.
          BCC_API_MODE: live
          BCC_NORMAL_SENDER_ID: 11111111-1111-4111-8111-111111111111
        run: node scripts/build-pages.mjs pages-out --base "/${{ github.event.repository.name }}"
      - name: Verify static transfer and recipient flags
        working-directory: frontend
        env:
          SOC_SYNTHETIC_REHEARSAL: '1'
          QA_EXPECT_STATIC: '1'
          QA_OUTPUT: ${{ github.workspace }}/.local-checks/pages-browser-ci
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npx --no-install playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/saqbol-pages"
          ln -s "$PWD/pages-out" "$RUNNER_TEMP/saqbol-pages/$REPO_NAME"
          python3 -m http.server 3014 --bind 127.0.0.1 --directory "$RUNNER_TEMP/saqbol-pages" > "$RUNNER_TEMP/saqbol-pages.log" 2>&1 &
          static_pid=$!
          trap 'kill "$static_pid"' EXIT
          sleep 1
          node scripts/qa-recipient-flags.cjs "http://127.0.0.1:3014/$REPO_NAME/"
          QA_OUTPUT="$GITHUB_WORKSPACE/.local-checks/pages-active-hold-ci" node scripts/qa-active-hold.cjs "http://127.0.0.1:3014/$REPO_NAME/"
      - name: Publish to gh-pages
        working-directory: frontend/pages-out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish static demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
