name: Integration verification
on:
  pull_request:
  push:
    branches: [main, 'feature/bekzat-*', 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bcc
          POSTGRES_PASSWORD: bcc
          POSTGRES_DB: bcc_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bcc -d bcc_integration_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full project oracle
        env:
          PYTEST_ADDOPTS: --junitxml=../.local-checks/backend-full.xml -ra
        run: bash verify.sh
      - name: Reproducible private Scam Check evaluation
        working-directory: backend
        run: uv run --no-sync python -m scripts.evaluate_scam_check --benchmark --output ../.local-checks/scam-check-evaluation.json
      - name: Save synthetic Scam Check metrics
        uses: actions/upload-artifact@v4
        with:
          name: scam-check-evaluation
          path: .local-checks/scam-check-evaluation.json
          include-hidden-files: true
          retention-days: 7
      - name: PostgreSQL and Redis integration tests
        working-directory: backend
        env:
          BCC_TEST_DATABASE_URL: postgresql+asyncpg://bcc:bcc@localhost:5432/bcc_integration_test
          BCC_TEST_POSTGRES_URL: postgresql+asyncpg://bcc:bcc@localhost:5432/bcc_integration_test
          BCC_TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          uv run --no-sync python -m scripts.verify_merged_migrations
          uv run --no-sync python -m scripts.verify_case_migrations
          uv run --no-sync pytest --junitxml=../.local-checks/backend-postgres.xml -ra tests/integrations tests/test_postgres_concurrency.py tests/test_recipient_flag_postgres.py tests/test_active_hold_postgres.py tests/test_postgres_linked_returns.py
      - name: Measure bounded velocity snapshots with real Redis
        working-directory: backend
        run: |
          uv run --no-sync python -m scripts.benchmark_velocity_capacity --redis-url redis://localhost:6379/14 > ../.local-checks/velocity-capacity.json
          cat ../.local-checks/velocity-capacity.json
          {
            echo '### Velocity snapshot on loopback Redis (milliseconds)'
            echo '```json'
            cat ../.local-checks/velocity-capacity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Count unique backend cases without double-counting reruns
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          passed, skipped = set(), set()
          for file in ('.local-checks/backend-full.xml', '.local-checks/backend-postgres.xml'):
              for case in ET.parse(file).iter('testcase'):
                  key = (case.attrib['classname'], case.attrib['name'])
                  if case.find('skipped') is not None:
                      skipped.add(key)
                  elif case.find('failure') is None and case.find('error') is None:
                      passed.add(key)
          result = {'unique_passed': len(passed), 'still_skipped': sorted(skipped - passed)}
          Path('.local-checks/backend-unique.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - name: Save exact backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-case-evidence
          path: |
            .local-checks/backend-*.xml
            .local-checks/backend-unique.json
            .local-checks/velocity-capacity.json
          include-hidden-files: true
          retention-days: 7
  compose-demo:
    # Pin the OS together with the browser harness; ubuntu-latest can change underneath it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BCC_INTEGRATIONS_ENABLED: 'true'
      BCC_INTEGRATIONS_TELEGRAM_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate ephemeral demo key
        run: |
          python -c "import os,secrets; key=secrets.token_hex(32); print('::add-mask::'+key); open(os.environ['GITHUB_ENV'],'a').write('BCC_INTEGRATIONS_SIGNING_KEY='+key+'\n')"
      - name: Build and start complete stack
        run: docker compose -f docker-compose.yml -f docker-compose.integrations.yml --profile integrations up -d --build --wait --wait-timeout 180
      - name: Seed synthetic core fixtures
        run: |
          docker compose exec -T backend python -m scripts.seed_bcc > /tmp/seed-report.txt
          docker compose restart backend
          docker compose -f docker-compose.yml -f docker-compose.integrations.yml --profile integrations up -d --wait --wait-timeout 120
      - name: Exercise fake end-to-end flow
        working-directory: backend
        run: uv run --python 3.12 python -m scripts.demo_operations
      - name: Verify existing browser demo with integrations disabled
        run: |
          docker compose -f docker-compose.yml -f docker-compose.integrations.yml --profile integrations stop integrations-worker
          BCC_INTEGRATIONS_ENABLED=false docker compose -f docker-compose.yml -f docker-compose.integrations.yml up -d --no-deps --wait --wait-timeout 120 backend
          test "$(curl --silent --output /tmp/integrations-disabled.json --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/integrations/health)" = 503
          npm install --prefix /tmp/bcc-browser-qa --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node /tmp/bcc-browser-qa/node_modules/playwright/cli.js install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/bcc-browser-qa/node_modules/playwright QA_OUTPUT="$GITHUB_WORKSPACE/.local-checks/browser-ci" node frontend/scripts/qa-mobile-soc.cjs http://127.0.0.1:3000
          PLAYWRIGHT_MODULE=/tmp/bcc-browser-qa/node_modules/playwright QA_OUTPUT="$GITHUB_WORKSPACE/.local-checks/soc-cases-ci" node frontend/scripts/qa-soc-cases.cjs http://127.0.0.1:3000
          SOC_SYNTHETIC_REHEARSAL=1 PLAYWRIGHT_MODULE=/tmp/bcc-browser-qa/node_modules/playwright QA_OUTPUT="$GITHUB_WORKSPACE/.local-checks/recipient-flags-ci" node frontend/scripts/qa-recipient-flags.cjs http://127.0.0.1:3000
          SOC_SYNTHETIC_REHEARSAL=1 PLAYWRIGHT_MODULE=/tmp/bcc-browser-qa/node_modules/playwright QA_OUTPUT="$GITHUB_WORKSPACE/.local-checks/active-hold-ci" node frontend/scripts/qa-active-hold.cjs http://127.0.0.1:3000
          SOC_SYNTHETIC_REHEARSAL=1 PLAYWRIGHT_MODULE=/tmp/bcc-browser-qa/node_modules/playwright QA_OUTPUT="$GITHUB_WORKSPACE/.local-checks/linked-transfer-ci" node frontend/scripts/qa-linked-transfer.cjs http://127.0.0.1:3000
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrations-disabled-browser-qa
          path: |
            .local-checks/browser-ci/
            .local-checks/soc-cases-ci/
            .local-checks/recipient-flags-ci/
            .local-checks/active-hold-ci/
            .local-checks/linked-transfer-ci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Shutdown disposable stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integrations.yml --profile integrations down -v
